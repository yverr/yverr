<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blogs | Rylle</title>

    <link rel="icon" href="assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script>
        (function () {
            var root = document.documentElement;
            try {
                var theme = localStorage.getItem('theme');
                if (!theme) theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                root.dataset.theme = theme;
                if (window.innerWidth <= 800 || localStorage.getItem('sidebar') === 'closed') {
                    root.classList.add('sidebar-closed');
                }
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle sidebar" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
    </button>

    <button class="icon-btn theme-btn" id="theme-btn" aria-label="Toggle dark mode">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>
        </svg>
    </button>

    <aside class="sidebar" id="sidebar">
        <a class="brand" href="index.html">yverr</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="blogs.html" aria-current="page">Blogs</a>
            <a href="reading.html">Reading</a>
            <a href="projects.html">Projects</a>
        </nav>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="content">
        <div class="blog-layout">
            <div class="column">
                <h1>My Blogs</h1>

                <p class="legend">
                    <span><span class="dot technical"></span>Technical</span>
                    <span><span class="dot reflection"></span>Reflection</span>
                    <span><span class="dot article"></span>Article</span>
                </p>

                <ul class="posts">
                    <li>
                        <time datetime="2026-10-26">2026/10/26</time>
                        <a href="blogs/gradient-descent.html"><span class="dot reflection"></span><mark>From 5 to 95: My Gradient Descent in Mathematics</mark></a>
                    </li>
                </ul>
            </div>

            <aside class="recent">
                <h2>Recently read</h2>
                <ul id="recent-list"></ul>
                <a class="more" href="reading.html">More</a>
            </aside>
        </div>
    </main>

    <script src="script.js"></script>
    <script src="reading.js"></script>
</body>
</html>
